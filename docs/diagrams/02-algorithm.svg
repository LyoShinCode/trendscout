<rect class="ok" x="640" y="514" width="300" height="48"/><text x="656" y="534" class="tx">Тип SLEEPER</text><text x="656" y="550" class="sm">правило FR-01</text>
<path class="l" d="M790,562 V600"/>
<path class="l" d="M380,588 V614"/><text x="390" y="606" class="lb">нет</text>

<path class="d" d="M380,614 L520,664 L380,714 L240,664 Z"/>
