<rect class="ok" x="640" y="640" width="300" height="48"/><text x="656" y="660" class="tx">Тип VIRAL</text><text x="656" y="676" class="sm">правило FR-03</text>
<path class="l" d="M790,688 V700 H560 V724"/>
<path class="l" d="M380,714 V740"/><text x="390" y="732" class="lb">нет</text>
<rect class="g" x="240" y="740" width="280" height="40"/><text x="256" y="764" class="tx">Журнал «Отказ»: какое условие не выполнено</text>
<path class="l" d="M380,780 V800"/>

<rect class="p" x="240" y="600" width="0" height="0"/>
<rect class="t" x="240" y="800" width="560" height="44" fill="#12494F" stroke="#12494F"/>
<text x="256" y="818" class="ti">Создание сигнала: confidence, дедупликация 8 недель,</text>
