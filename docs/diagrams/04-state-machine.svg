<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="IBM Plex Sans, sans-serif">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#403C36"/></marker>
<marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B3261E"/></marker></defs>
<style>
 .s{fill:#FFFFFF;stroke:#403C36;stroke-width:1.4}
 .ok{fill:#E8F2E9;stroke:#2F7A45;stroke-width:1.4}
 .no{fill:#FBEAE8;stroke:#B3261E;stroke-width:1.4}
 .l{stroke:#403C36;stroke-width:1.4;fill:none;marker-end:url(#a)}
 .lr{stroke:#B3261E;stroke-width:1.4;fill:none;stroke-dasharray:6 4;marker-end:url(#r)}
 .tx{fill:#1C1A17;font:600 13px 'IBM Plex Sans'}
 .lb{fill:#403C36;font:11px 'IBM Plex Sans'}
 .sm{fill:#6E685E;font:11px 'IBM Plex Sans'}
</style>
<rect width="880" height="400" fill="#F6F4EF"/>
<text x="30" y="28" fill="#12494F" font-size="15" font-weight="600">Статус-машина сигнала (UC-01) · недопустимый переход → 409</text>
<circle cx="70" cy="110" r="12" fill="#12494F"/>
<path class="l" d="M82,110 H140"/>
<rect class="s" x="140" y="84" width="150" height="52"/><text x="166" y="115" class="tx">NEW</text>
<text x="150" y="156" class="sm">provisional, если данные неполные</text>
<path class="l" d="M290,110 H360"/><text x="300" y="100" class="lb">взять в работу</text>
<rect class="s" x="360" y="84" width="170" height="52"/><text x="386" y="115" class="tx">IN_REVIEW</text>
<path class="l" d="M530,96 H620 V76 H660"/><text x="560" y="66" class="lb">подтвердить</text>
<rect class="ok" x="660" y="50" width="170" height="52"/><text x="682" y="81" class="tx">CONFIRMED</text>
<path class="l" d="M530,122 H620 V196 H660"/><text x="560" y="212" class="lb">отклонить (с причиной)</text>
<rect class="no" x="660" y="170" width="170" height="52"/><text x="686" y="201" class="tx">REJECTED</text>
<path class="l" d="M745,102 V170"/><text x="752" y="140" class="lb">переоткрыть</text>
<path class="l" d="M745,222 V262 H215 V136"/><text x="420" y="254" class="lb">восстановить</text>
<path class="lr" d="M215,136 V136"/>
<path class="lr" d="M120,300 H360 V136"/><text x="130" y="292" class="lb" fill="#B3261E">FR-04: пришли полные данные → автоматический отзыв</text>
<rect x="60" y="300" width="60" height="34" fill="#FBFAF6" stroke="#B3261E" stroke-dasharray="5 4"/>
<text x="70" y="322" class="sm">таймер 72ч</text>
<text x="30" y="376" class="sm">Каждый переход пишется в AlertNote (audit trail). Массовые действия применяют переходы по тем же правилам.</text>
</svg>